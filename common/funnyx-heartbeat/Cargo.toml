[package]
name = "funnyx-heartbeat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FunnyX private in-system heartbeat: socket PING/PONG + Config registry register/probe"
readme = false

[features]
default = ["http-client"]
http-client = ["dep:reqwest"]

[dependencies]
funnyx-config = { workspace = true }
funnyx-net-api = { workspace = true }
funnyx-socket = { workspace = true }
funnyx-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time", "macros", "sync", "rt", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tracing = "0.1"
