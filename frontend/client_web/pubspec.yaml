name: client_web
description: FunnyX Client Web (Flutter Web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  envied: ^1.1.1
  get: ^4.7.2
  intl: any
  toastification: ^3.0.2
  url_launcher: ^6.3.1
  funnyx_common:
    path: ../common

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  envied_generator: ^1.1.1

flutter:
  generate: true
  uses-material-design: true
