[package]
name = "funnyx-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FunnyX Gateway — public HTTP/socket ingress, auth gate, reverse proxy"
authors = ["FunnyX"]

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
dotenvy = "0.15"
funnyx-config = { path = "../../common/funnyx-config" }
funnyx-health = { path = "../../common/funnyx-health" }
funnyx-heartbeat = { path = "../../common/funnyx-heartbeat" }
funnyx-net-api = { path = "../../common/funnyx-net-api" }
funnyx-socket = { path = "../../common/funnyx-socket" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
