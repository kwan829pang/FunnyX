[package]
name = "funnyx-config-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FunnyX Config Server — whitelist JSON, service registry, socket heartbeat probe"
authors = ["FunnyX"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
funnyx-config = { path = "../../common/funnyx-config" }
funnyx-health = { path = "../../common/funnyx-health" }
funnyx-heartbeat = { path = "../../common/funnyx-heartbeat", default-features = false }
funnyx-net-api = { path = "../../common/funnyx-net-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
