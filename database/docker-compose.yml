# FunnyX shared local stores — PostgreSQL + Redis + MongoDB (Phase 1).
# From this folder:
#   cp .env.sample .env   # optional
#   docker compose up -d
#   docker compose down
#
# Host ports: postgres 5432 · redis 6379 · mongo 27017
# First Postgres boot applies run_all.sql only (no seed).

name: funnyx-db

# Subnets avoid common Docker defaults (172.17–172.21) that often collide
# with other local stacks (e.g. 172.20.0.0/16).
networks:
  funnyx-db-postgres:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.10.0/24
  funnyx-db-redis:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.11.0/24
  funnyx-db-mongo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.12.0/24

volumes:
  postgres_data:
  redis_data:
  mongo_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: funnyx-postgres
    networks:
      funnyx-db-postgres:
        ipv4_address: 172.33.10.10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnyx}
      POSTGRES_DB: ${POSTGRES_DB:-funnyx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/ddl:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: funnyx-redis
    networks:
      funnyx-db-redis:
        ipv4_address: 172.33.11.10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: funnyx-mongo
    networks:
      funnyx-db-mongo:
        ipv4_address: 172.33.12.10
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
