# FunnyX platform mesh (Phase 5 §21) — run AFTER database/docker-compose.yml.
# From repo root:
#   docker compose -f database/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml up --build -d
#   docker compose -f deploy/docker-compose.yml down
#
# Services use host.docker.internal for Postgres/Redis/Mongo published ports.
# Inter-service URLs use Compose DNS on funnyx-platform.

name: funnyx-platform

networks:
  funnyx-platform:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

x-common-env: &common-env
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-demo-internal-key}
  SESSION_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-demo-internal-key}
  CONFIG_SERVER_URL: http://config-server:8090
  RUST_LOG: ${RUST_LOG:-info}
  POSTGRES_URL: ${POSTGRES_URL:-postgres://funnyx:funnyx@host.docker.internal:5432/funnyx}
  HTTP_HOST: "0.0.0.0"

x-build-service: &build-service
  context: ..
  dockerfile: deploy/Dockerfile.service

services:
  config-server:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/config_server
        BIN_NAME: funnyx-config-server
    image: funnyx/config-server:local
    container_name: funnyx-config-server
    networks: [funnyx-platform]
    ports: ["8090:8090"]
    environment:
      <<: *common-env
      HTTP_PORT: "8090"
      PUBLIC_BASE_URL: http://127.0.0.1:8090
      SERVICE_NAME: funnyx-config-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  session-token-server:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/session_token_server
        BIN_NAME: funnyx-session-token-server
    image: funnyx/session-token-server:local
    container_name: funnyx-session-token-server
    networks: [funnyx-platform]
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      HTTP_PORT: "8082"
      PUBLIC_BASE_URL: http://127.0.0.1:8082
      SERVICE_NAME: funnyx-session-token-server
      SESSION_STORE: memory
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  client-center:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/client_center
        BIN_NAME: funnyx-client-center
    image: funnyx/client-center:local
    container_name: funnyx-client-center
    networks: [funnyx-platform]
    ports: ["8083:8083", "9001:9001"]
    environment:
      <<: *common-env
      HTTP_PORT: "8083"
      SOCKET_PORT: "9001"
      PUBLIC_BASE_URL: http://127.0.0.1:8083
      SERVICE_NAME: funnyx-client-center
      SESSION_TOKEN_SERVER_URL: http://session-token-server:8082
      CORE_ENGINE_URL: http://core-engine:18200
      MESSAGE_CENTER_URL: http://message-center:8085
      MONGO_URL: ${MONGO_URL:-mongodb://host.docker.internal:27017}
      MONGO_DB: funnyx_client
    depends_on:
      session-token-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  admin-api:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/admin_api
        BIN_NAME: funnyx-admin-api
    image: funnyx/admin-api:local
    container_name: funnyx-admin-api
    networks: [funnyx-platform]
    ports: ["18300:18300", "9003:9003"]
    environment:
      <<: *common-env
      HTTP_PORT: "18300"
      SOCKET_PORT: "9003"
      PUBLIC_BASE_URL: http://127.0.0.1:18300
      SERVICE_NAME: funnyx-admin-api
      SESSION_TOKEN_SERVER_URL: http://session-token-server:8082
      CORE_ENGINE_URL: http://core-engine:18200
    depends_on:
      session-token-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18300/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  webhook-server:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/webhook_server
        BIN_NAME: funnyx-webhook-server
    image: funnyx/webhook-server:local
    container_name: funnyx-webhook-server
    networks: [funnyx-platform]
    ports: ["8084:8084", "9004:9004"]
    environment:
      <<: *common-env
      HTTP_PORT: "8084"
      SOCKET_PORT: "9004"
      PUBLIC_BASE_URL: http://127.0.0.1:8084
      SERVICE_NAME: funnyx-webhook-server
      CLIENT_CENTER_URL: http://client-center:8083
    depends_on:
      client-center:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  message-center:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/message_center
        BIN_NAME: funnyx-message-center
    image: funnyx/message-center:local
    container_name: funnyx-message-center
    networks: [funnyx-platform]
    ports: ["8085:8085", "9005:9005"]
    environment:
      <<: *common-env
      HTTP_PORT: "8085"
      SOCKET_PORT: "9005"
      PUBLIC_BASE_URL: http://127.0.0.1:8085
      SERVICE_NAME: funnyx-message-center
      GATEWAY_URL: http://gateway:8080
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  core-engine:
    build:
      context: ../backend/core_engine
      dockerfile: Dockerfile
      args:
        BIN_NAME: funnyx-core-engine
    image: funnyx/core-engine:local
    container_name: funnyx-core-engine
    networks: [funnyx-platform]
    ports: ["18200:18200"]
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "18200"
      MESSAGE_CENTER_URL: http://message-center:8085
      RUST_LOG: ${RUST_LOG:-info}
      DATA_DIR: /data
    volumes:
      - core_engine_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18200/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  gateway:
    build:
      <<: *build-service
      args:
        SERVICE_DIR: backend/gateway
        BIN_NAME: funnyx-gateway
    image: funnyx/gateway:local
    container_name: funnyx-gateway
    networks: [funnyx-platform]
    ports: ["8080:8080", "9000:9000"]
    environment:
      <<: *common-env
      HTTP_PORT: "8080"
      SOCKET_PORT: "9000"
      PUBLIC_BASE_URL: http://gateway:8080
      SERVICE_NAME: funnyx-gateway
      INSTANCE_ID: gateway-1
      SOCKET_ADVERTISE_URL: tcp://gateway:9000
      CLIENT_CENTER_URL: http://client-center:8083
      ADMIN_API_URL: http://admin-api:18300
      MESSAGE_CENTER_URL: http://message-center:8085
      SESSION_TOKEN_SERVER_URL: http://session-token-server:8082
      REGISTRY_REFRESH_MS: "5000"
    depends_on:
      client-center:
        condition: service_healthy
      message-center:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      session-token-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  core_engine_data:
